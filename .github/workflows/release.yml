name: Release

# Tag a version to ship installers:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Windows installers (MSI + NSIS, GPU/Vulkan whisper) and the
# macOS app/dmg (Metal whisper, Apple Silicon), and attaches everything to a
# DRAFT GitHub Release for the owner to review and publish.
#
# Code signing is not wired yet: Windows installs show a SmartScreen
# "unrecognized app" prompt, and macOS users must right-click → Open the
# first time (unsigned/un-notarized build).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate the release: the tag MUST equal the checked-in version (the tag is the
  # source of truth, SDLC §3.1), and generate the user-facing release notes from
  # the Conventional-Commit log with git-cliff (SDLC §3.2). A mismatch fails the
  # whole run before any installer is built.
  version-guard:
    name: Version guard + release notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog range
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag equals package.json version
        if: github.ref_type == 'tag'
        run: node scripts/version.mjs check --tag "${{ github.ref_name }}"
      - name: Generate release notes (git-cliff)
        id: cliff
        if: github.ref_type == 'tag'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

  # Matrix build lives in the reusable build-installers.yml (SDLC §5.2). On a
  # tag it attaches the installers to a DRAFT Release carrying the git-cliff
  # notes; the owner publishes, which is what activates the updater rollout
  # (§5.3, the single most dangerous auto-action). A workflow_dispatch run
  # (no tag) builds and uploads bundles as artifacts instead.
  build:
    needs: version-guard
    uses: ./.github/workflows/build-installers.yml
    secrets: inherit
    with:
      release: ${{ github.ref_type == 'tag' }}
      tag_name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      release_name: ${{ github.ref_type == 'tag' && format('conva {0}', github.ref_name) || '' }}
      release_body: ${{ needs.version-guard.outputs.notes }}
